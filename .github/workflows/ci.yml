name: CI

on:
  pull_request:
    branches: [main]

jobs:
  format-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm i

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build
